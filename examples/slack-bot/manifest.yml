display_information:
  name: Matih
  description: Ask your data questions, see Gems, dashboards and forecasts from Slack.
  background_color: "#1f2937"
features:
  bot_user:
    display_name: Matih
    always_online: true
  slash_commands:
    - command: /matih
      description: Ask Matih about your data
      usage_hint: "ask <question> | gems | dashboard <name> | forecast <question> | workspace | help"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
      - files:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
