<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Embedded Matih</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 0 auto; max-width: 64rem; padding: 1rem; }
      #status { color: #555; min-height: 1.5em; }
      #status.error { color: #b00020; }
    </style>
  </head>
  <body>
    <h1>Sales</h1>
    <p id="status">Loading...</p>

    <!--
      No src or token here: the element asks token-endpoint (POST, same origin) for both, and
      again for a new token each time the embed says its token is about to expire.
    -->
    <matih-embed token-endpoint="/api/matih-embed-token" height="640" title="Sales dashboard"></matih-embed>

    <script type="module" src="/matih-embed.js"></script>
    <script type="module">
      const status = document.getElementById("status");
      const embed = document.querySelector("matih-embed");
      embed.addEventListener("matih:ready", () => (status.textContent = ""));
      embed.addEventListener("matih:error", (event) => {
        status.className = "error";
        status.textContent = `The dashboard could not be shown (${event.detail.code}).`;
      });
    </script>
  </body>
</html>
