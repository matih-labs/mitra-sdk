[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mitra-sdk"
version = "0.1.0"
description = "Python client for the Matih public API (ask, Gems, dashboards, forecasts)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Matih Labs" }]
keywords = ["matih", "analytics", "api", "sdk", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
]

[project.optional-dependencies]
# HTTP/2: one connection carries many concurrent requests (httpx[http2] adds h2).
http2 = ["h2>=4,<5"]
dev = [
  "h2>=4,<5",
  "hatchling",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/matih-labs/mitra-sdk"
Source = "https://github.com/matih-labs/mitra-sdk"
Issues = "https://github.com/matih-labs/mitra-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mitra"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/NOTICE", "/pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]
ignore = ["E501"]
