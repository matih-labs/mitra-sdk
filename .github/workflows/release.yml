name: release

# Publishing happens only when a tag is pushed:
#   py-vX.Y.Z  -> PyPI (trusted publishing, no stored token)
#   ts-vX.Y.Z  -> npm (with provenance; needs the NPM_TOKEN secret)

on:
  push:
    tags:
      - "py-v*"
      - "ts-v*"

permissions:
  contents: read

jobs:
  publish-python:
    if: startsWith(github.ref, 'refs/tags/py-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        working-directory: sdks/python
        run: |
          tag="${GITHUB_REF_NAME#py-v}"
          ver="$(python - <<'PY'
          import tomllib
          print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])
          PY
          )"
          test "$tag" = "$ver" || { echo "tag $tag != pyproject version $ver" >&2; exit 1; }
      - name: Build
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/

  publish-typescript:
    if: startsWith(github.ref, 'refs/tags/ts-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#ts-v}"
          ver="$(node -p "require('./package.json').version")"
          test "$tag" = "$ver" || { echo "tag $tag != package.json version $ver" >&2; exit 1; }
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npm run generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
